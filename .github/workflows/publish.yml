# Publie l'app sur GitHub Pages.
# Chaque dimanche matin, rafraîchit d'abord les prix (Lidl, Auchan, Carrefour, Kaufland) puis republie.
name: Publier Duo

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 5 * * 0" # dimanche 05:00 UTC = 08:00 à Bucarest en été, 07:00 en hiver
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        if: github.event_name != 'push'
        with:
          node-version: 22

      - name: Rafraîchir les prix
        if: github.event_name != 'push'
        run: node tools/fetch-prices.mjs

      - name: Enregistrer les nouveaux prix
        if: github.event_name != 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/prices.js
          git diff --cached --quiet || git commit -m "Prix du $(date +%F)"
          git push

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - id: deploy
        uses: actions/deploy-pages@v4
